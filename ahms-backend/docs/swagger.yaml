      - treatment
  /uploads/patient-photo:
    post:
      consumes:
      - multipart/form-data
      description: Accepts a multipart field "file" (JPG/PNG/WEBP, max 2MB). Returns
        the stored /uploads URL. The photo is saved to the patient in a later registration/update
        call.
      parameters:
      - description: Image file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
