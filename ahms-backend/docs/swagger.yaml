      consumes:
      - application/json
      description: All sessions must be completed/skipped before completion.
      parameters:
      - description: Plan ID
        in: path
        name: id
        required: true
        type: string
      - description: Final assessment
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/treatments.CompletePlanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
