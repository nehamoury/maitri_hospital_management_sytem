                data:
                  $ref: '#/definitions/treatments.PlanResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
