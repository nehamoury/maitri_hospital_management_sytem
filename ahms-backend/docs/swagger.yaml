        categories later). Sessions are auto-scheduled from start date and frequency.
        A PKR number is auto-generated.
      parameters:
      - description: Plan
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/treatments.CreatePlanRequest'
