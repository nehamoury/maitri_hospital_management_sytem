      parameters:
      - description: Plan ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/treatments.UpdatePlanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
