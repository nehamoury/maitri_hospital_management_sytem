host: localhost:8080
info:
  contact: {}
  description: Ayurvedic Hospital Management System — Phase 1 API (Auth, Roles, Departments,
    Patients, Doctors, Appointments, Dashboard).
  title: AHMS Backend API
  version: "1.0"
paths:
  /appointments:
    get:
      parameters:
      - description: Doctor ID
        in: query
        name: doctor_id
        type: string
      - description: Patient ID
        in: query
        name: patient_id
        type: string
      - description: Date (YYYY-MM-DD)
        in: query
        name: date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/appointments.AppointmentResponse'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: List appointments (optionally filter by doctor, patient, date)
      tags:
      - appointments
    post:
      consumes:
      - application/json
      parameters:
      - description: Appointment
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/appointments.CreateAppointmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/appointments.AppointmentResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Book an appointment (auto-generates the queue token number)
      tags:
      - appointments
  /appointments/{id}:
    get:
      parameters:
      - description: Appointment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/appointments.AppointmentResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get an appointment by id
      tags:
      - appointments
  /appointments/{id}/status:
    put:
      consumes:
      - application/json
      parameters:
      - description: Appointment ID
        in: path
        name: id
        required: true
        type: string
      - description: Status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/appointments.UpdateAppointmentStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/appointments.AppointmentResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Update an appointment's status
      tags:
      - appointments
  /audit-logs:
    get:
      description: |-
        Returns recent audit-log entries. Optional filters:
        ?entity=patient&id=<uuid>  entries for one record
        ?user=<uuid>               entries by one user
        Without filters, returns the most recent entries.
      parameters:
      - description: Entity type to filter (e.g. patient, referral, bill)
        in: query
        name: entity
        type: string
      - description: Entity id to filter (requires entity)
        in: query
        name: id
        type: string
      - description: User id to filter by actor
        in: query
        name: user
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/audit.AuditLogResponse'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: Query the audit trail
      tags:
      - audit
  /auth/login:
    post:
      consumes:
      - application/json
      description: Validates credentials and returns a JWT access + refresh token
        pair.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Log in with email and password
      tags:
      - auth
  /auth/logout:
    post:
      description: 'Stateless JWT logout: the client discards its tokens. This endpoint
        exists as a stable contract and audit point for future token-blacklisting
        (e.g. via Redis).'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Log out the current session
      tags:
      - auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.UserResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Get the currently authenticated user
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.LoginResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Exchange a refresh token for a new token pair
      tags:
      - auth
  /bills:
    get:
      parameters:
      - description: Filter by payment status (UNPAID/PARTIAL/PAID)
        in: query
        name: status
        type: string
      - description: Search by bill number
        in: query
        name: query
        type: string
      - description: Filter by patient ID
