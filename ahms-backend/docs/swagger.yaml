      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/prescriptions.PrescriptionListItem'
                  type: array
              type: object
      security:
      - BearerAuth: []
